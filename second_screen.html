<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Второй экран</title>
<style>
  :root {
    --page-bg: rgba(19,18,23,.86);
    --solid-bg: #131217;
    --line: rgba(255,255,255,.09);
    --ink: #F2F0EE;
    --dim: #9C97A3;
    --mute: #6b6672;
    --live: #54C77A;
    --alarm: #E36B6B;
    --accent-text: #D6C8FF;
    --accent-bg: rgba(139,92,246,.16);
    --accent-border: rgba(139,92,246,.5);
    --btn-bg: #F2F0EE;
    --btn-text: #111111;
    --control-bg: rgba(255,255,255,.08);
    --control-hover: rgba(255,255,255,.16);
    --edge-highlight: rgba(255,255,255,.12);
  }
  /* Rinat's MagicPath light mockup (designs.magicpath.ai/v1/boldly-dusk-9705) —
     same layout/tokens, light palette instead of the dark default above. */
  :root[data-theme="light"] {
    --page-bg: rgba(255,255,255,.92);
    --solid-bg: #ffffff;
    --line: rgba(0,0,0,.08);
    --ink: #17151A;
    --dim: #86828C;
    --mute: #B4B0B8;
    --live: #2E9E5B;
    --alarm: #D14343;
    --accent-text: #6D28D9;
    --accent-bg: rgba(124,58,237,.08);
    --accent-border: rgba(124,58,237,.35);
    --btn-bg: #17151A;
    --btn-text: #ffffff;
    --control-bg: rgba(0,0,0,.06);
    --control-hover: rgba(0,0,0,.1);
    --edge-highlight: rgba(255,255,255,.6);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: transparent;
    font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif;
  }
  body {
    background: var(--page-bg);
    border-top: 1px solid var(--edge-highlight);
    backdrop-filter: blur(18px) saturate(180%);
    color: var(--ink);
    overflow: hidden;
  }
  @media (prefers-reduced-transparency: reduce) {
    body { background: var(--solid-bg); backdrop-filter: none; }
  }

  .app { display: flex; height: calc(100vh - 33px); }

  .col { padding: 20px; overflow-y: auto; }
  .col + .col { border-left: 1px solid var(--line); }
  .col-heard { width: 330px; flex-shrink: 0; overflow-y: hidden; padding: 0; display: flex; flex-direction: column; }
  .col-heard .col-header { padding: 20px 20px 14px; margin-bottom: 0; flex-shrink: 0; }
  #heard-lines { overflow-y: auto; padding: 0 20px 20px; flex: 1; min-height: 0; }
  .col-recorded { flex: 1; min-width: 0; }
  .col-hints { width: 340px; flex-shrink: 0; }

  .col-header { display: flex; align-items: center; margin: 0 0 14px; }
  .section-label {
    font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--dim);
  }
  .body-text { font-size: 15px; font-weight: 400; line-height: 1.45; margin: 0; }
  .mute { color: var(--mute); }

  .live-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--live);
    display: inline-block; margin-right: 6px;
    animation: breathe 1.8s ease-in-out infinite;
  }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) {
    .live-dot { animation: none; opacity: 0.85; }
  }

  .heard-line { margin-bottom: 16px; }
  .heard-who { font-size: 12px; font-weight: 600; color: var(--dim); margin-bottom: 4px; }
  .heard-line .hit {
    text-decoration: underline dotted;
    text-decoration-color: var(--dim);
  }

  .agenda-section { margin-bottom: 20px; }
  .agenda-section .section-label { margin-bottom: 10px; }
  .agenda-row { margin-bottom: 12px; }
  .agenda-row-title { font-size: 14px; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .agenda-row-fact { font-size: 13px; color: var(--mute); margin-top: 2px; }
  .agenda-row-annotation { font-size: 12px; color: var(--alarm); margin-top: 2px; font-weight: 600; }
  .agenda-row.alarm .agenda-row-title,
  .agenda-row.alarm .agenda-row-fact { color: var(--alarm); }
  .agenda-section.dimmed .agenda-row:not(.alarm) { opacity: .5; }

  .footer {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 20px; text-align: center;
    font-size: 12px; color: var(--mute);
    border-top: 1px solid var(--line);
    background: var(--page-bg);
  }

  .hint-title { font-size: 18px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; margin: 12px 0 12px; }
  .hint-block { margin-bottom: 18px; }
  .hint-block .section-label { margin-bottom: 8px; }
  .hint-block p { margin: 0 0 4px; }

  .ask-pill {
    background: var(--accent-bg); border: 1px solid var(--accent-border);
    border-radius: 10px; padding: 10px 12px; color: var(--accent-text);
    font-size: 14px; line-height: 1.4;
  }

  .window-controls {
    position: fixed; top: 10px; right: 12px; z-index: 10;
    display: flex; gap: 6px;
  }
  .window-controls button {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--control-bg); border: none; color: var(--dim);
    font-size: 15px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 140ms ease, color 140ms ease;
  }
  .window-controls button:hover { background: var(--control-hover); color: var(--ink); }
  .window-controls button:active { transform: scale(.92); }
  #theme-btn { font-size: 12px; }

  .recap-panel {
    flex-shrink: 0; border-top: 1px solid var(--line);
    padding: 12px 20px 16px; max-height: 240px;
    display: flex; flex-direction: column; min-height: 0;
  }
  .recap-panel-header {
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0; margin-bottom: 8px;
  }
  .recap-panel-header button {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--control-bg); border: none; color: var(--dim);
    font-size: 13px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .recap-panel-header button:hover { background: var(--control-hover); color: var(--ink); }
  #recap-panel-body { overflow-y: auto; min-height: 0; }
  .recap-task { margin-bottom: 12px; }
  .recap-task:last-child { margin-bottom: 0; }
  .recap-task-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .recap-said-line {
    font-size: 12px; line-height: 1.4; color: var(--dim);
    margin: 0 0 3px 0; padding-left: 12px; position: relative;
  }
  .recap-said-line::before { content: "–"; position: absolute; left: 0; }
</style>
</head>
<body>
  <div class="window-controls">
    <button id="recap-btn" title="Прошлый дейлик" aria-label="Показать прошлый дейлик" style="display:none;">🕘</button>
    <button id="theme-btn" title="Сменить тему" aria-label="Сменить тему">🌙</button>
    <button id="minimize-btn" title="Свернуть" aria-label="Свернуть окно">–</button>
    <button id="close-btn" title="Закрыть" aria-label="Закрыть окно">×</button>
  </div>
  <div class="app">
    <div class="col col-heard">
      <div class="col-header">
        <span class="live-dot" id="live-dot" style="display:none;"></span>
        <span class="section-label">Слышу</span>
      </div>
      <div id="heard-lines"></div>
      <div class="recap-panel" id="recap-panel" style="display:none">
        <div class="recap-panel-header">
          <span class="section-label" id="recap-panel-title">Прошлый дейлик</span>
          <button id="recap-close-btn" title="Закрыть" aria-label="Закрыть прошлый дейлик">×</button>
        </div>
        <div id="recap-panel-body"></div>
      </div>
    </div>
    <div class="col col-recorded">
      <div class="col-header"><span class="section-label">Записал</span></div>
      <div id="recorded-sections"></div>
    </div>
    <div class="col col-hints">
      <div class="col-header"><span class="section-label">Подсказываю</span></div>
      <p class="hint-title" id="hint-title"></p>
      <div class="hint-block">
        <div class="section-label">В Jira</div>
        <div id="hint-facts"></div>
      </div>
      <div class="hint-block">
        <div class="section-label">Сказали</div>
        <div id="hint-said"></div>
      </div>
      <div class="hint-block">
        <div class="section-label">Спроси</div>
        <div id="hint-ask"><span class="mute">—</span></div>
      </div>
    </div>
  </div>
  <div class="footer">В Jira ничего не изменено</div>

<script>
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function underlineHtml(text, hitWords) {
  const escaped = escapeHtml(text);
  if (!hitWords || hitWords.length === 0) return escaped;
  const pattern = hitWords
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
    .join("|");
  const re = new RegExp("(?<![\\p{L}\\p{N}])(" + pattern + ")(?![\\p{L}\\p{N}])", "giu");
  return escaped.replace(re, '<span class="hit">$1</span>');
}

function renderHeard(state) {
  const container = document.getElementById("heard-lines");
  document.getElementById("live-dot").style.display = state.phase === "live" ? "inline-block" : "none";

  const wasNearBottom = (container.scrollHeight - container.scrollTop - container.clientHeight) < 24;
  const previousScrollTop = container.scrollTop;
  container.innerHTML = "";
  state.lines.forEach(line => {
    const row = document.createElement("div");
    row.className = "heard-line";
    const who = document.createElement("div");
    who.className = "heard-who";
    who.textContent = line.task ? `${line.who || "?"} → ${line.task}` : (line.who || "?");
    const text = document.createElement("p");
    text.className = "body-text";
    text.innerHTML = underlineHtml(line.text, line.hit_words);
    row.appendChild(who);
    row.appendChild(text);
    container.appendChild(row);
  });
  if (wasNearBottom) {
    container.scrollTop = container.scrollHeight;
  } else {
    container.scrollTop = previousScrollTop;
  }
}

function buildAgendaRow(r) {
  const row = document.createElement("div");
  row.className = "agenda-row" + (r.alarm ? " alarm" : "");
  const title = document.createElement("div");
  title.className = "agenda-row-title";
  title.textContent = `${r.title} · ${r.key}`;
  const fact = document.createElement("div");
  fact.className = "agenda-row-fact";
  fact.textContent = r.row;
  row.appendChild(title);
  row.appendChild(fact);
  if (r.annotation) {
    const ann = document.createElement("div");
    ann.className = "agenda-row-annotation";
    ann.textContent = r.annotation;
    row.appendChild(ann);
  }
  return row;
}

function buildAgendaSection(label, rows, dimmed) {
  const section = document.createElement("div");
  section.className = "agenda-section" + (dimmed ? " dimmed" : "");
  const heading = document.createElement("div");
  heading.className = "section-label";
  heading.textContent = label;
  section.appendChild(heading);
  rows.forEach(r => section.appendChild(buildAgendaRow(r)));
  return section;
}

function renderRecorded(state) {
  const container = document.getElementById("recorded-sections");
  container.innerHTML = "";
  if (state.phase === "before") {
    container.appendChild(buildAgendaSection("Повестка", state.agenda.remaining, true));
    return;
  }
  if (state.agenda.done.length > 0 || state.phase === "after") {
    container.appendChild(buildAgendaSection("Обсудили", state.agenda.done, false));
  }
  const secondLabel = state.phase === "after" ? "Не обсудили" : "Осталось";
  container.appendChild(buildAgendaSection(secondLabel, state.agenda.remaining, true));
}

function renderHints(state) {
  const titleEl = document.getElementById("hint-title");
  const factsEl = document.getElementById("hint-facts");
  const saidEl = document.getElementById("hint-said");
  const askEl = document.getElementById("hint-ask");

  if (!state.current_task) {
    titleEl.textContent = "";
    factsEl.innerHTML = "";
    saidEl.innerHTML = "";
    askEl.innerHTML = '<span class="mute">Подсказка появится, когда узнаю задачу</span>';
    return;
  }

  titleEl.textContent = state.current_task.title;

  factsEl.innerHTML = "";
  state.current_task.facts.forEach(f => {
    const p = document.createElement("p");
    p.className = "body-text mute";
    p.textContent = f;
    factsEl.appendChild(p);
  });

  saidEl.innerHTML = "";
  if (state.current_task.said.length === 0) {
    saidEl.innerHTML = '<span class="mute">—</span>';
  } else {
    state.current_task.said.forEach(s => {
      const p = document.createElement("p");
      p.className = "body-text";
      p.textContent = "– " + s;
      saidEl.appendChild(p);
    });
  }

  if (state.current_task.ask) {
    askEl.innerHTML = "";
    const pill = document.createElement("div");
    pill.className = "ask-pill";
    pill.textContent = state.current_task.ask;
    askEl.appendChild(pill);
  } else {
    askEl.innerHTML = '<span class="mute">—</span>';
  }
}

function renderMeeting(state) {
  renderHeard(state);
  renderRecorded(state);
  renderHints(state);
}

window.renderMeeting = renderMeeting;

function renderRecap(data) {
  const dt = new Date(data.generated_at);
  const dateLabel = dt.toLocaleDateString("ru-RU") + " " +
    dt.toLocaleTimeString("ru-RU", {hour: "2-digit", minute: "2-digit"});
  document.getElementById("recap-panel-title").textContent = "Прошлый дейлик — " + dateLabel;
  const body = document.getElementById("recap-panel-body");
  body.innerHTML = "";
  data.tasks.forEach(task => {
    const div = document.createElement("div");
    div.className = "recap-task";
    const title = document.createElement("div");
    title.className = "recap-task-title";
    title.textContent = task.title;
    div.appendChild(title);
    task.said.forEach(line => {
      const p = document.createElement("p");
      p.className = "recap-said-line";
      p.textContent = line;
      div.appendChild(p);
    });
    body.appendChild(div);
  });
  document.getElementById("recap-btn").style.display = "flex";
  document.getElementById("recap-panel").style.display = "flex";
}
window.renderRecap = renderRecap;

document.getElementById("recap-btn").addEventListener("click", () => {
  document.getElementById("recap-panel").style.display = "flex";
});
document.getElementById("recap-close-btn").addEventListener("click", () => {
  document.getElementById("recap-panel").style.display = "none";
});

document.getElementById("minimize-btn").addEventListener("click", () => {
  if (window.pywebview && window.pywebview.api) {
    window.pywebview.api.minimize_window();
  }
});
document.getElementById("close-btn").addEventListener("click", () => {
  if (window.pywebview && window.pywebview.api) {
    window.pywebview.api.close_window();
  }
});

function setTheme(theme) {
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("theme-btn").textContent = theme === "light" ? "☀" : "🌙";
  try { localStorage.setItem("theme", theme); } catch (e) {}
}
document.getElementById("theme-btn").addEventListener("click", () => {
  const current = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
  setTheme(current === "light" ? "dark" : "light");
});
let savedTheme = "dark";
try { savedTheme = localStorage.getItem("theme") || "dark"; } catch (e) {}
setTheme(savedTheme);
</script>
</body>
</html>
